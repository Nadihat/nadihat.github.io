<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Added description meta tag -->
    <meta name="description" content="An interactive web audio player that generates frequencies based on multiples of 731.35 Hz with adjustable volume and waveform.">

    <title>Enhanced Frequency Multiplier Player | AnthroHeart</title>

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <!-- Container for dynamic background elements -->
    <div id="star-container" aria-hidden="true"></div>

    <main class="container">
        <h1>Healing Frequency Multiplier</h1>
        <h2>731.35 Hz Base | by AnthroHeart</h2>

        <div class="controls">
            <!-- Frequency Multiplier Control -->
            <div class="control-group">
                <label id="multiplier-label" for="multiplier-slider">Frequency Multiplier</label>
                <input
                    type="range"
                    id="multiplier-slider"
                    min="1"
                    max="35"
                    value="1"
                    step="0.25"
                    aria-labelledby="multiplier-label"
                    aria-valuemin="1"
                    aria-valuemax="35"
                    aria-valuenow="1"
                >
                <!-- Added aria-live for screen reader announcements -->
                <div id="frequency-display" class="value-display" aria-live="polite">
                    1x - 731.35 Hz
                </div>
            </div>

            <!-- Volume Control -->
            <div class="control-group">
                <label id="volume-label" for="volume-slider">Volume</label>
                <input
                    type="range"
                    id="volume-slider"
                    min="0"
                    max="1"
                    value="0.25"
                    step="0.01"
                    aria-labelledby="volume-label"
                    aria-valuemin="0"
                    aria-valuemax="1"
                    aria-valuenow="0.25"
                >
                <div id="volume-display" class="value-display">
                    Volume: 25%
                </div>
            </div>
        </div>

        <!-- Combined Play/Stop Button -->
        <button id="play-stop-button" class="button" aria-label="Play sound">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="20" height="20" fill="currentColor">
                <!-- Play icon path -->
                <path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/>
            </svg>
            Play
        </button>

    </main>

    <!-- Link to external JavaScript, deferred -->
    <script src="script.js" defer></script>
</body>
</html>
